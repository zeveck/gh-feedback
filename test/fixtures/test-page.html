<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gh-feedback Test Fixture</title>
  <script type="module" src="../../gh-feedback.js"></script>
  <style>
    body { margin: 0; padding: 20px; font-family: sans-serif; }
    #event-log { margin-top: 40px; font-size: 12px; color: #666; }
    .event-entry { margin: 2px 0; }
  </style>
</head>
<body>
  <h1>gh-feedback Test Page</h1>

  <!-- Default: proxy mode, bottom-right (FAB explicit since default is now button) -->
  <gh-feedback id="fab-default" repo="test/repo" endpoint="/feedback" trigger="fab"></gh-feedback>

  <!-- Dark theme -->
  <gh-feedback id="dark" repo="test/repo" endpoint="/feedback" theme="dark" trigger="fab"></gh-feedback>

  <!-- Positions -->
  <gh-feedback id="top-left" repo="test/repo" endpoint="/feedback" position="top-left" trigger="fab"></gh-feedback>
  <gh-feedback id="top-right" repo="test/repo" endpoint="/feedback" position="top-right" trigger="fab"></gh-feedback>
  <gh-feedback id="bottom-left" repo="test/repo" endpoint="/feedback" position="bottom-left" trigger="fab"></gh-feedback>

  <!-- With button-text (pill shape) -->
  <gh-feedback id="pill" repo="test/repo" endpoint="/feedback" button-text="Help" trigger="fab"></gh-feedback>

  <!-- No config (no endpoint or token) — for error testing -->
  <gh-feedback id="no-config" repo="test/repo" trigger="fab"></gh-feedback>

  <!-- With labels attribute -->
  <gh-feedback id="with-labels" repo="test/repo" endpoint="/feedback" labels="feedback,user-reported" trigger="fab"></gh-feedback>

  <!-- Direct mode (with token, no endpoint) -->
  <gh-feedback id="direct" repo="test/repo" token="ghp_test123" trigger="fab"></gh-feedback>

  <!-- Trigger: button (now the default, kept explicit for clarity) -->
  <gh-feedback id="trigger-btn" repo="test/repo" endpoint="/feedback" trigger="button"></gh-feedback>

  <!-- Trigger: link -->
  <gh-feedback id="trigger-link" repo="test/repo" endpoint="/feedback" trigger="link" button-text="Send feedback"></gh-feedback>

  <!-- Severity field (severity is now shown by default, no attribute needed) -->
  <gh-feedback id="with-severity" repo="test/repo" endpoint="/feedback" trigger="fab"></gh-feedback>

  <!-- Direct mode with severity (for testing priority labels) -->
  <gh-feedback id="direct-severity" repo="test/repo" token="ghp_test123" trigger="fab"></gh-feedback>

  <!-- No severity (opt-out) -->
  <gh-feedback id="no-severity" repo="test/repo" endpoint="/feedback" trigger="fab" no-severity></gh-feedback>

  <!-- Icon variants -->
  <gh-feedback id="icon-bug" repo="test/repo" endpoint="/feedback" icon="bug" trigger="fab"></gh-feedback>
  <gh-feedback id="icon-megaphone" repo="test/repo" endpoint="/feedback" icon="megaphone" trigger="fab"></gh-feedback>
  <gh-feedback id="icon-lightbulb" repo="test/repo" endpoint="/feedback" icon="lightbulb" trigger="fab"></gh-feedback>
  <gh-feedback id="icon-pencil" repo="test/repo" endpoint="/feedback" icon="pencil" trigger="fab"></gh-feedback>

  <!-- Size variants -->
  <gh-feedback id="size-sm" repo="test/repo" endpoint="/feedback" size="sm" trigger="fab"></gh-feedback>
  <gh-feedback id="size-md" repo="test/repo" endpoint="/feedback" size="md" trigger="fab"></gh-feedback>
  <gh-feedback id="size-lg" repo="test/repo" endpoint="/feedback" size="lg" trigger="fab"></gh-feedback>

  <!-- Custom color -->
  <gh-feedback id="custom-color" repo="test/repo" endpoint="/feedback" color="#6f42c1" trigger="fab"></gh-feedback>

  <!-- Popup color -->
  <gh-feedback id="popup-color" repo="test/repo" endpoint="/feedback" popup-color="#6f42c1" trigger="fab"></gh-feedback>

  <!-- Popup color independent of trigger color -->
  <gh-feedback id="popup-color-indep" repo="test/repo" endpoint="/feedback" color="#ff0000" popup-color="#0000ff" trigger="fab"></gh-feedback>

  <!-- Custom types -->
  <gh-feedback id="custom-types" repo="test/repo" endpoint="/feedback" types="bug,feature,question,ui" trigger="fab"></gh-feedback>

  <!-- No type icons -->
  <gh-feedback id="no-type-icons" repo="test/repo" endpoint="/feedback" no-type-icons trigger="fab"></gh-feedback>

  <!-- Icon: memo (default, explicit) -->
  <gh-feedback id="icon-memo" repo="test/repo" endpoint="/feedback" icon="memo" trigger="fab"></gh-feedback>

  <!-- Icon: none -->
  <gh-feedback id="icon-none" repo="test/repo" endpoint="/feedback" icon="none" trigger="fab"></gh-feedback>

  <!-- Repo as full URL -->
  <gh-feedback id="repo-url" repo="https://github.com/test/repo" endpoint="/feedback" trigger="fab"></gh-feedback>

  <!-- Border customization -->
  <gh-feedback id="border-custom" repo="test/repo" endpoint="/feedback" border-color="#333" border-width="2" border-radius="4" trigger="fab"></gh-feedback>

  <!-- Pixel size -->
  <gh-feedback id="size-px" repo="test/repo" endpoint="/feedback" size="40" trigger="fab"></gh-feedback>

  <!-- Trigger: none (API testing) -->
  <gh-feedback id="trigger-none" repo="test/repo" endpoint="/feedback" trigger="none"></gh-feedback>

  <!-- Context testing -->
  <gh-feedback id="with-context" repo="test/repo" endpoint="/feedback" trigger="fab"></gh-feedback>

  <!-- Event log -->
  <div id="event-log"></div>

  <script type="module">
    const log = document.getElementById('event-log');
    document.addEventListener('gh-feedback:submit', (e) => {
      const entry = document.createElement('div');
      entry.className = 'event-entry';
      entry.dataset.event = 'submit';
      entry.textContent = `submit: ${JSON.stringify(e.detail)}`;
      log.appendChild(entry);
    });
    document.addEventListener('gh-feedback:filed', (e) => {
      const entry = document.createElement('div');
      entry.className = 'event-entry';
      entry.dataset.event = 'filed';
      entry.textContent = `filed: ${JSON.stringify(e.detail)}`;
      log.appendChild(entry);
    });
  </script>
</body>
</html>
